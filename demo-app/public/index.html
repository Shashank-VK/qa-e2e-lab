<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Todo App | Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card" data-testid="login-page">
      <p class="eyebrow">QA E2E Lab</p>
      <h1>Sign in</h1>
      <p class="muted">Use the seeded QA account to manage your todos.</p>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" data-testid="email-input" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" data-testid="password-input" autocomplete="current-password" />
        <p class="error" role="alert" data-testid="login-error"></p>
        <button type="submit" data-testid="login-button">Sign in</button>
      </form>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
